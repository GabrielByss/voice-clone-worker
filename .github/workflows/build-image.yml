# Buduje obraz workera MiniMax Music 3 i wypycha do GHCR. Działa, gdy katalog runpod/voice jest
# osobnym (publicznym) repo na GitHubie – tak jak acestep-ringtones-worker.
# Uruchomienie: zakładka Actions -> "Build voice clone worker image" -> Run workflow, albo push taga v1, v2, ...
#
# Uwaga: z wypieczonymi wagami obraz ma ~16 GB (wagi ~10 GB + baza). Standardowy runner GitHuba ma
# za mało dysku, dlatego używamy easimon/maximize-build-space (LVM z wolnego miejsca /mnt + /).
# Jeśli build i tak nie mieści się w limicie, alternatywy: RunPod "Deploy from GitHub" (build na
# infrastrukturze RunPod, limit 80 GB) albo BAKE_MODELS=false + network volume z wagami.
name: Build voice clone worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag obrazu (np. v1)"
        required: true
        default: "v1"
      bake_models:
        description: "Wypiec wagi do obrazu (true/false)"
        required: true
        default: "true"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /var/lib/docker

      - name: Restart docker on the new mount
        run: |
          sudo systemctl restart docker
          df -h / /var/lib/docker

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; fi
          echo "bake=${{ inputs.bake_models || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/voice-clone-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            BAKE_MODELS=${{ steps.meta.outputs.bake }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Summary
        run: echo "IMAGE=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
